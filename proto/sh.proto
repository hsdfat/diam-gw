  fixed required Auth-Session-State auth_session_state = 3;
  fixed required Origin-Host origin_host = 4;                // HSS identity
  fixed required Origin-Realm origin_realm = 5;
  fixed required Destination-Host destination_host = 6;      // AS (must be direct)
  fixed required Destination-Realm destination_realm = 7;
  fixed required User-Identity user_identity = 8;            // Affected user

  // Conditional AVPs
  optional User-Data user_data = 9;              // Changed data (XML)
  optional Wildcarded-IMPU wildcarded_impu = 10;
  repeated Repository-Data-ID repository_data_id = 11;  // Changed data IDs
  repeated Service-Indication service_indication = 12;  // Which service changed

