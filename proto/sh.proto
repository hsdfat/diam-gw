// ================================================================================
command Subscribe-Notifications-Request {
  code = 308;
  application_id = 16777217;
  request = true;
  proxiable = true;
  description = "Subscribe to or unsubscribe from HSS data change notifications";

  // Required AVPs (Table 6.1.3-1)
  fixed required Session-Id session_id = 1;
  fixed required Vendor-Specific-Application-Id vendor_specific_application_id = 2;
  fixed required Auth-Session-State auth_session_state = 3;
  fixed required Origin-Host origin_host = 4;
  fixed required Origin-Realm origin_realm = 5;
  fixed required Destination-Realm destination_realm = 6;
  fixed required User-Identity user_identity = 7;            // Public-Identity or MSISDN
  fixed required Subs-Req-Type subs_req_type = 8;            // SUBSCRIBE or UNSUBSCRIBE
  repeated fixed required Data-Reference data_reference = 9; // What data to monitor

  // Conditional AVPs
  repeated Service-Indication service_indication = 10;  // Required for RepositoryData
  optional Identity-Set identity_set = 11;
  optional Expiry-Time expiry_time = 12;                     // Desired subscription expiry
  repeated DSAI-Tag dsai_tag = 13;

  // Optional AVPs
  optional DRMP drmp = 14;
  optional Destination-Host destination_host = 15;
  optional User-Name user_name = 16;                         // IMSI
  optional Wildcarded-IMPU wildcarded_impu = 17;
  optional Send-Data-Indication send_data_indication = 18;   // Include current data in SNA
  optional One-Time-Notification one_time_notification = 19;
  repeated Supported-Features supported_features = 20;
  repeated Proxy-Info proxy_info = 21;
  repeated Route-Record route_record = 22;
  repeated AVP avp = 23;
}

