  repeated Supported-Features supported_features = 9;
  optional Failed-AVP failed_avp = 10;
  repeated Proxy-Info proxy_info = 11;
  repeated Route-Record route_record = 12;
  repeated AVP avp = 13;
}

// ================================================================================
//                         USAGE NOTES
// ================================================================================
//
// 1. SESSION HANDLING:
//    - Sh uses implicitly terminated sessions
//    - Auth-Session-State MUST be set to NO_STATE_MAINTAINED (1)
//
// 2. INTERFACE ROLES:
//    - UDR/UDA: AS/SCS → HSS (pull user data)
//    - PUR/PUA: AS/SCS → HSS (update repository data)
//    - SNR/SNA: AS/SCS → HSS (subscribe/unsubscribe notifications)
//    - PNR/PNA: HSS → AS/SCS (push notification on data change)
//
// 3. DATA FORMAT:
//    - User-Data AVP contains XML conforming to the Sh-Data schema (TS 29.328 Annex A)
//    - Repository data is service-specific XML identified by Service-Indication
//    - HSS data (location, state, etc.) follows defined XML schema
//
// 4. SUBSCRIPTION LIFECYCLE:
//    - AS subscribes via SNR with Subs-Req-Type = SUBSCRIBE(0)
//    - HSS confirms with SNA including granted Expiry-Time
//    - When data changes, HSS sends PNR to AS
//    - AS acknowledges with PNA
//    - AS unsubscribes via SNR with Subs-Req-Type = UNSUBSCRIBE(1)
//    - Subscriptions with One-Time-Notification auto-cancel after first PNR
//
// 5. TRANSPORT:
//    - Uses SCTP or TCP as transport protocol
//    - Port: 3868 (Diameter standard port)
//
// 6. RELATED SPECIFICATIONS:
//    - 3GPP TS 29.328: IMS Application Level Gateway for the Sh interface
//    - 3GPP TS 29.329: Sh Interface Based on the Diameter Protocol
//    - 3GPP TS 23.228: IP Multimedia Subsystem (IMS) Stage 2
//    - 3GPP TS 29.229: Cx/Cx interfaces (defines AVPs 601, 628-630 reused here)
//    - RFC 6733: Diameter Base Protocol
//
// ================================================================================
//                         AVP CODE SUMMARY
// ================================================================================
//
// SH-SPECIFIC AVPs (Vendor-ID = 10415 / 3GPP):
// -----------------------------------------------
//   Public-Identity              (601)  - UTF8String  - M,V  (from Cx, reused)
//   Supported-Features           (628)  - Grouped     - V    (from Cx, reused)
//   Feature-List-ID              (629)  - Unsigned32  - V    (from Cx, reused)
//   Feature-List                 (630)  - Unsigned32  - V    (from Cx, reused)
//   Wildcarded-IMPU              (636)  - UTF8String  - V    (from Cx, reused)
//   User-Identity                (700)  - Grouped     - M,V
//   MSISDN                       (701)  - OctetString - M,V
//   User-Data (Sh)               (702)  - OctetString - M,V
//   Data-Reference               (703)  - Enumerated  - M,V
//   Service-Indication           (704)  - OctetString - M,V
//   Subs-Req-Type                (705)  - Enumerated  - M,V
//   Requested-Domain             (706)  - Enumerated  - M,V
//   Current-Location             (707)  - Enumerated  - M,V
//   Identity-Set                 (708)  - Enumerated  - M,V
//   Expiry-Time                  (709)  - Time        - M,V
//   Send-Data-Indication         (710)  - Enumerated  - V
//   DSAI-Tag                     (711)  - OctetString - M,V
//   One-Time-Notification        (712)  - Enumerated  - V
//   Requested-Nodes              (713)  - Unsigned32  - V
//   Serving-Node-Indication      (714)  - Enumerated  - V
//   Repository-Data-ID           (715)  - Grouped     - M,V
//   Sequence-Number              (716)  - Unsigned32  - M,V
//   Pre-Paging-Supported         (717)  - Enumerated  - V
//   Local-Time-Zone-Indication   (718)  - Enumerated  - V
//   UDR-Flags                    (719)  - Unsigned32  - V
//
// ================================================================================
