  // Conditional AVPs (at least one must be present)
  optional Charging-Information charging_information = 9;    // Updated charging info
  optional SIP-Auth-Data-Item sip_auth_data_item = 10;       // Updated auth data
  optional User-Data user_data = 11;                         // Updated IMS subscription XML

  // Optional AVPs
  optional DRMP drmp = 12;
  optional PPR-Flags ppr_flags = 13;                         // Bit 0: Restoration_Indication
  repeated Supported-Features supported_features = 14;
  repeated Proxy-Info proxy_info = 15;
  repeated Route-Record route_record = 16;
  repeated AVP avp = 17;
}

// ================================================================================
// Push-Profile-Answer (PPA) - Command Code 305
// 3GPP TS 29.228 Section 6.1.6
// Sent from S-CSCF to HSS
// Purpose: Confirm the profile update
// ================================================================================
command Push-Profile-Answer {
  code = 305;
  application_id = 16777216;
  request = false;
  proxiable = true;
  description = "Acknowledgement of pushed profile update";

  // Required AVPs
  fixed required Session-Id session_id = 1;
  fixed required Vendor-Specific-Application-Id vendor_specific_application_id = 2;
  fixed required Auth-Session-State auth_session_state = 3;
  fixed required Origin-Host origin_host = 4;
  fixed required Origin-Realm origin_realm = 5;

  // Result
  optional Result-Code result_code = 6;
  optional Experimental-Result experimental_result = 7;

  // Optional AVPs
  optional DRMP drmp = 8;
  repeated Supported-Features supported_features = 9;
  optional Failed-AVP failed_avp = 10;
  repeated Proxy-Info proxy_info = 11;
  repeated Route-Record route_record = 12;
  repeated AVP avp = 13;
}

// ================================================================================
//                         USAGE NOTES
// ================================================================================
//
// 1. SESSION HANDLING:
//    - Cx uses implicitly terminated sessions
//    - Auth-Session-State MUST be set to NO_STATE_MAINTAINED (1)
//
// 2. INTERFACE ROLES:
//    - UAR/UAA: I-CSCF → HSS (registration/roaming authorization)
//    - SAR/SAA: S-CSCF → HSS (assignment, profile download, deregistration)
//    - LIR/LIA: I-CSCF → HSS (routing, terminating call to registered user)
//    - MAR/MAA: S-CSCF → HSS (authentication vector retrieval)
//    - RTR/RTA: HSS → S-CSCF (network-initiated deregistration)
//    - PPR/PPA: HSS → S-CSCF (subscriber data push/update)
//
// 3. TRANSPORT:
//    - Uses SCTP or TCP as transport protocol
//    - Port: 3868 (Diameter standard port)
//
// 4. RELATED SPECIFICATIONS:
//    - 3GPP TS 29.228: Cx/Dx interface (IMS Cx Interface Based on the Diameter Protocol)
//    - 3GPP TS 29.229: Cx and Dx Interfaces Based on the Diameter Protocol
//    - 3GPP TS 23.228: IP Multimedia Subsystem (IMS) Stage 2
//    - 3GPP TS 24.229: SIP and SDP Stage 3
//    - RFC 6733: Diameter Base Protocol
//    - RFC 4590: Diameter Protocol for HTTP Digest
