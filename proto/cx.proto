// Diameter Cx Interface Application
// Based on 3GPP TS 29.228 / TS 29.229 v16.x
// Interface between P-CSCF/I-CSCF/S-CSCF and HSS (IMS)

syntax = "diameter1";

package diameter.cx;

option go_package = "github.com/hsdfat/diam-gw/commands/cx";

// ================================================================================
//                         APPLICATION IDENTIFIER
// ================================================================================
// Cx/Dx Application ID: 16777216 (allocated by IANA)
// Vendor ID: 10415 (3GPP)

const CX_APPLICATION_ID = 16777216;
const VENDOR_ID_3GPP = 10415;

// ================================================================================
//                         COMMAND CODE VALUES
// ================================================================================
// Table 6.1/1: Command-Code values for Cx Interface (3GPP TS 29.228)

const UAR_COMMAND_CODE = 300;  // User-Authorization-Request/Answer
const SAR_COMMAND_CODE = 301;  // Server-Assignment-Request/Answer
const LIR_COMMAND_CODE = 302;  // Location-Info-Request/Answer
const MAR_COMMAND_CODE = 303;  // Multimedia-Auth-Request/Answer
const RTR_COMMAND_CODE = 304;  // Registration-Termination-Request/Answer
const PPR_COMMAND_CODE = 305;  // Push-Profile-Request/Answer

// ================================================================================
//                         ENUMERATED VALUE DEFINITIONS
// ================================================================================

// User-Authorization-Type (AVP Code 623)
// Indicates the type of user authorization being requested
enum UserAuthorizationType {
  REGISTRATION = 0;                    // Initial registration
  DE_REGISTRATION = 1;                 // De-registration
  REGISTRATION_AND_CAPABILITIES = 2;  // Registration with server capabilities query
}

// Server-Assignment-Type (AVP Code 614)
// Indicates the type of server assignment operation
enum ServerAssignmentType {
  NO_ASSIGNMENT = 0;                              // No assignment, data download only
  REGISTRATION = 1;                               // Initial registration
  RE_REGISTRATION = 2;                            // Re-registration (same S-CSCF)
  UNREGISTERED_USER = 3;                          // Unregistered user originating call
  TIMEOUT_DEREGISTRATION = 4;                     // Registration timer expired
  USER_DEREGISTRATION = 5;                        // User-initiated de-registration
  TIMEOUT_DEREGISTRATION_STORE_SERVER_NAME = 6;   // Timer expiry, store server name
  USER_DEREGISTRATION_STORE_SERVER_NAME = 7;      // User deregister, store server name
  ADMINISTRATIVE_DEREGISTRATION = 8;              // Network-initiated de-registration
  AUTHENTICATION_FAILURE = 9;                     // Authentication procedure failure
  AUTHENTICATION_TIMEOUT = 10;                    // Authentication timeout
  DEREGISTRATION_TOO_MUCH_DATA = 11;              // De-reg due to excess subscription data
}

// Reason-Code (AVP Code 616)
// Indicates the reason for de-registration in RTR
enum ReasonCode {
  PERMANENT_TERMINATION = 0;  // User permanently terminated
  NEW_SERVER_ASSIGNED = 1;    // New S-CSCF assigned
  SERVER_CHANGE = 2;          // S-CSCF change required
  REMOVE_S_CSCF = 3;          // Remove current S-CSCF assignment
}

// User-Data-Already-Available (AVP Code 624)
// Indicates whether S-CSCF already has the user profile
enum UserDataAlreadyAvailable {
  USER_DATA_NOT_AVAILABLE = 0;  // S-CSCF does not have user data
  USER_DATA_ALREADY_AVAILABLE = 1;  // S-CSCF already has user data
}

// Originating-Request (AVP Code 633)
// Indicates request originates from originating side
enum OriginatingRequest {
  ORIGINATING = 0;  // Request is for originating service
}

// Loose-Route-Indication (AVP Code 638)
// Indicates whether loose routing is required
enum LooseRouteIndication {
  LOOSE_ROUTE_NOT_REQUIRED = 0;  // Standard routing
  LOOSE_ROUTE_REQUIRED = 1;      // Loose route required for restoration
}

// Multiple-Registration-Indication (AVP Code 648)
// Indicates whether multiple registration is involved
enum MultipleRegistrationIndication {
  NOT_MULTIPLE_REGISTRATION = 0;  // Single registration
  MULTIPLE_REGISTRATION = 1;      // Multiple registered contacts
}

// Session-Priority (AVP Code 650)
// Indicates the priority of the IMS session
enum SessionPriority {
  PRIORITY_0 = 0;  // Lowest priority
  PRIORITY_1 = 1;
  PRIORITY_2 = 2;
  PRIORITY_3 = 3;
  PRIORITY_4 = 4;  // Highest priority
}

// Emergency-Registration-Result (AVP Code 652)
// Result of an emergency registration
enum EmergencyRegistrationResult {
  EMERGENCY_REGISTRATION = 0;      // Registered as emergency
  IMS_EMERGENCY_REGISTRATION = 1;  // IMS emergency registration
}

// ================================================================================
//                         EXPERIMENTAL RESULT CODES
// ================================================================================
// Cx Specific Experimental-Result-Code values (3GPP TS 29.229 Section 6.2)
// Vendor-Id: 10415 (3GPP)

const DIAMETER_SUBSEQUENT_REQUEST = 4121;            // Success - subsequent request
const DIAMETER_ERROR_USER_UNKNOWN = 5001;            // User not found in HSS
const DIAMETER_ERROR_IDENTITIES_DONT_MATCH = 5002;   // Public/Private identity mismatch
const DIAMETER_ERROR_IDENTITY_NOT_REGISTERED = 5003; // Identity not registered
const DIAMETER_ERROR_ROAMING_NOT_ALLOWED = 5004;     // Roaming not permitted
const DIAMETER_ERROR_IDENTITY_ALREADY_REGISTERED = 5005; // Identity already registered
const DIAMETER_ERROR_AUTH_SCHEME_NOT_SUPPORTED = 5006;    // Auth scheme not supported
const DIAMETER_ERROR_IN_ASSIGNMENT_TYPE = 5007;      // Invalid assignment type
const DIAMETER_ERROR_TOO_MUCH_DATA = 5008;           // Subscription data too large
const DIAMETER_ERROR_NOT_SUPPORTED_USER_DATA = 5009; // User data format not supported

