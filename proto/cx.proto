  fixed required SIP-Auth-Data-Item sip_auth_data_item = 9;  // Auth scheme + challenge response
  fixed required SIP-Number-Auth-Items sip_number_auth_items = 10;  // Number of vectors requested
  fixed required Server-Name server_name = 11;               // S-CSCF SIP URI

  // Optional AVPs
  optional DRMP drmp = 12;
  optional Destination-Host destination_host = 13;
  repeated Supported-Features supported_features = 14;
  repeated Proxy-Info proxy_info = 15;
