// ================================================================================
//                         COMMAND DEFINITIONS
// ================================================================================

// ================================================================================
// User-Authorization-Request (UAR) - Command Code 300
// 3GPP TS 29.228 Section 6.1.1
// Sent from I-CSCF to HSS
// Purpose: Authorize user registration and determine the S-CSCF to use
// ================================================================================
command User-Authorization-Request {
  code = 300;
  application_id = 16777216;
  request = true;
  proxiable = true;
  description = "Request authorization for user registration and S-CSCF selection";

  // Required AVPs (Table 6.1.1.1)
  fixed required Session-Id session_id = 1;
  fixed required Vendor-Specific-Application-Id vendor_specific_application_id = 2;
  fixed required Auth-Session-State auth_session_state = 3;  // NO_STATE_MAINTAINED
  fixed required Origin-Host origin_host = 4;                // I-CSCF identity
  fixed required Origin-Realm origin_realm = 5;              // I-CSCF realm
  fixed required Destination-Realm destination_realm = 6;    // HSS realm
  fixed required User-Name user_name = 7;                    // Private User Identity (IMPI)
  fixed required Public-Identity public_identity = 8;        // Public User Identity
  fixed required Visited-Network-Identifier visited_network_identifier = 9;  // Visited NW ID

  // Optional AVPs
  optional DRMP drmp = 10;
  optional Destination-Host destination_host = 11;          // Specific HSS if known
  optional User-Authorization-Type user_authorization_type = 12;  // Default: REGISTRATION(0)
  optional UAR-Flags uar_flags = 13;                        // Bit 0: emergency reg
  repeated Supported-Features supported_features = 14;
  repeated Proxy-Info proxy_info = 15;
  repeated Route-Record route_record = 16;
  repeated AVP avp = 17;
}

// ================================================================================
// User-Authorization-Answer (UAA) - Command Code 300
// 3GPP TS 29.228 Section 6.1.1
// Sent from HSS to I-CSCF
// Purpose: Return authorization result and S-CSCF selection information
// ================================================================================
command User-Authorization-Answer {
  code = 300;
  application_id = 16777216;
  request = false;
  proxiable = true;
  description = "Response to UAR with S-CSCF selection information";

  // Required AVPs
  fixed required Session-Id session_id = 1;
  fixed required Vendor-Specific-Application-Id vendor_specific_application_id = 2;
  fixed required Auth-Session-State auth_session_state = 3;
  fixed required Origin-Host origin_host = 4;                // HSS identity
  fixed required Origin-Realm origin_realm = 5;              // HSS realm

  // Result (one of Result-Code or Experimental-Result must be present)
  optional Result-Code result_code = 6;
  optional Experimental-Result experimental_result = 7;

  // Conditional AVPs (present on success)
  optional Server-Name server_name = 8;              // Assigned S-CSCF SIP URI
  optional Server-Capabilities server_capabilities = 9;  // If no S-CSCF assigned

  // Optional AVPs
  optional DRMP drmp = 10;
  optional Wildcarded-Public-Identity wildcarded_public_identity = 11;
  optional UAR-Flags uar_flags = 12;
  repeated Supported-Features supported_features = 13;
  optional Failed-AVP failed_avp = 14;
  repeated Proxy-Info proxy_info = 15;
  repeated Route-Record route_record = 16;
  repeated AVP avp = 17;
}

// ================================================================================
// Server-Assignment-Request (SAR) - Command Code 301
// 3GPP TS 29.228 Section 6.1.2
// Sent from S-CSCF to HSS
// Purpose: Register/deregister S-CSCF and download user profile
// ================================================================================
command Server-Assignment-Request {
  code = 301;
  application_id = 16777216;
  request = true;
  proxiable = true;
  description = "Request S-CSCF registration in HSS and user profile download";

  // Required AVPs (Table 6.1.2.1)
  fixed required Session-Id session_id = 1;
  fixed required Vendor-Specific-Application-Id vendor_specific_application_id = 2;
  fixed required Auth-Session-State auth_session_state = 3;
  fixed required Origin-Host origin_host = 4;                // S-CSCF identity
  fixed required Origin-Realm origin_realm = 5;              // S-CSCF realm
  fixed required Destination-Realm destination_realm = 6;    // HSS realm
  fixed required Server-Name server_name = 7;                // S-CSCF SIP URI
  fixed required Server-Assignment-Type server_assignment_type = 8;  // Reason for assignment

  // Conditional AVPs
  optional User-Name user_name = 9;                         // IMPI (if known)
  repeated Public-Identity public_identity = 10;   // IMPUs being deregistered

  // Optional AVPs
  optional DRMP drmp = 11;
  optional Destination-Host destination_host = 12;
  optional User-Data-Already-Available user_data_already_available = 13;
  optional SCSCF-Restoration-Info scscf_restoration_info = 14;
  optional Multiple-Registration-Indication multiple_registration_indication = 15;
  optional Session-Priority session_priority = 16;
  optional Wildcarded-IMPU wildcarded_impu = 17;
  repeated Supported-Features supported_features = 18;
  repeated Proxy-Info proxy_info = 19;
  repeated Route-Record route_record = 20;
  repeated AVP avp = 21;
}

// ================================================================================
// Server-Assignment-Answer (SAA) - Command Code 301
// 3GPP TS 29.228 Section 6.1.2
// Sent from HSS to S-CSCF
// Purpose: Confirm assignment and provide user subscription data
// ================================================================================
command Server-Assignment-Answer {
  code = 301;
  application_id = 16777216;
  request = false;
  proxiable = true;
  description = "Response to SAR with user profile and charging function addresses";

  // Required AVPs
  fixed required Session-Id session_id = 1;
  fixed required Vendor-Specific-Application-Id vendor_specific_application_id = 2;
  fixed required Auth-Session-State auth_session_state = 3;
  fixed required Origin-Host origin_host = 4;
  fixed required Origin-Realm origin_realm = 5;

  // Result
  optional Result-Code result_code = 6;
  optional Experimental-Result experimental_result = 7;

  // Conditional AVPs (present on success)
  optional User-Name user_name = 8;               // Confirmed IMPI
  optional User-Data user_data = 9;               // IMS subscription XML
  optional Charging-Information charging_information = 10;  // Charging function addresses
  optional Associated-Identities associated_identities = 11;  // Other private identities
  optional Loose-Route-Indication loose_route_indication = 12;
  optional SCSCF-Restoration-Info scscf_restoration_info = 13;
  optional Associated-Registered-Identities associated_registered_identities = 14;
  optional Server-Name server_name = 15;          // Confirmed S-CSCF name

  // Optional AVPs
  optional DRMP drmp = 16;
  optional Wildcarded-IMPU wildcarded_impu = 17;
  repeated Supported-Features supported_features = 18;
  optional Failed-AVP failed_avp = 19;
  repeated Proxy-Info proxy_info = 20;
  repeated Route-Record route_record = 21;
  repeated AVP avp = 22;
}

// ================================================================================
// Location-Info-Request (LIR) - Command Code 302
// 3GPP TS 29.228 Section 6.1.3
// Sent from I-CSCF to HSS
// Purpose: Request the name of the S-CSCF currently serving a user
// ================================================================================
command Location-Info-Request {
  code = 302;
  application_id = 16777216;
  request = true;
  proxiable = true;
  description = "Request current S-CSCF location information for a user";

  // Required AVPs (Table 6.1.3.1)
  fixed required Session-Id session_id = 1;
  fixed required Vendor-Specific-Application-Id vendor_specific_application_id = 2;
  fixed required Auth-Session-State auth_session_state = 3;
  fixed required Origin-Host origin_host = 4;
  fixed required Origin-Realm origin_realm = 5;
  fixed required Destination-Realm destination_realm = 6;
  fixed required Originating-Request originating_request = 7;  // ORIGINATING(0) if originating
  fixed required Public-Identity public_identity = 8;          // Requested public identity

  // Optional AVPs
  optional DRMP drmp = 9;
  optional Destination-Host destination_host = 10;
  optional User-Authorization-Type user_authorization_type = 11;  // For emergency override
  optional UAR-Flags uar_flags = 12;
  repeated Supported-Features supported_features = 13;
  repeated Proxy-Info proxy_info = 14;
  repeated Route-Record route_record = 15;
  repeated AVP avp = 16;
}

// ================================================================================
// Location-Info-Answer (LIA) - Command Code 302
// 3GPP TS 29.228 Section 6.1.3
// Sent from HSS to I-CSCF
// Purpose: Return serving S-CSCF name or capabilities for re-assignment
// ================================================================================
command Location-Info-Answer {
  code = 302;
  application_id = 16777216;
  request = false;
  proxiable = true;
  description = "Response to LIR with S-CSCF name or selection capabilities";

  // Required AVPs
  fixed required Session-Id session_id = 1;
  fixed required Vendor-Specific-Application-Id vendor_specific_application_id = 2;
  fixed required Auth-Session-State auth_session_state = 3;
  fixed required Origin-Host origin_host = 4;
  fixed required Origin-Realm origin_realm = 5;

  // Result
  optional Result-Code result_code = 6;
  optional Experimental-Result experimental_result = 7;

  // Conditional AVPs (present on success)
  optional Server-Name server_name = 8;              // Serving S-CSCF SIP URI
  optional Server-Capabilities server_capabilities = 9;  // If selection needed
  optional Wildcarded-Public-Identity wildcarded_public_identity = 10;  // Matching wildcard
  optional Loose-Route-Indication loose_route_indication = 11;
  optional SCSCF-Restoration-Info scscf_restoration_info = 12;

  // Optional AVPs
  optional DRMP drmp = 13;
  repeated Supported-Features supported_features = 14;
  optional Failed-AVP failed_avp = 15;
  repeated Proxy-Info proxy_info = 16;
  repeated Route-Record route_record = 17;
  repeated AVP avp = 18;
}

// ================================================================================
// Multimedia-Auth-Request (MAR) - Command Code 303
// 3GPP TS 29.228 Section 6.1.4
// Sent from S-CSCF to HSS
